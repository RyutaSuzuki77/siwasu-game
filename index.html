<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>師走ゲーム</title>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
  <input id="idInput" 
    type="text" 
    maxlength="20"
    style="
      position: fixed;
      top: 100px ;
      left: 100px;
      width: 1px;
      height: 1px;
      transform: translateZ(0);
      font-size: 20px;
      background: transparent;
      border: none;
      outline: none;
      color: transparent;
      caret-color: transparent;
      -webkit-text-fill-color: transparent;
      padding: 0;
      ime-mode: disabled;
    "
  >
</body>
</html>

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden; /* ← スクロール禁止 */
    height: 100%;
    touch-action: none;
  }

  canvas {
    display: block; /* ← 余白を消す */
  }
</style>
